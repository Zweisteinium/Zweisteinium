<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-label="Zw, Zweisteinium, element 198">
  <style>
    :root { --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --accent: #58c4f5; }
    text { fill: var(--fg); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .tile { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 1; animation: draw .7s cubic-bezier(.6,0,.2,1) both; }
    .orbit { fill: none; stroke: var(--accent); stroke-opacity: .25; }
    .in { animation: fade .35s ease-out both; }
    .e { fill: var(--accent); animation: fade .3s .7s both; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect class="tile" x="4" y="4" width="192" height="212" rx="6" pathLength="1"/>

  <text class="mono in" x="18" y="32" font-size="14" style="fill: var(--accent); animation-delay: .2s">198</text>
  <text class="mono in" x="182" y="32" font-size="11" text-anchor="end" style="fill: var(--muted); animation-delay: .25s">[504]</text>

  <g transform="rotate(-18 100 108)">
    <path id="orbit" class="orbit in" d="M22,108 a78,30 0 1,0 156,0 a78,30 0 1,0 -156,0" style="animation-delay: .4s"/>
    <circle class="e" r="3.5">
      <animateMotion dur="9s" begin=".7s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
    </circle>
  </g>

  <text class="in" x="100" y="132" font-size="72" font-weight="600" text-anchor="middle" style="animation-delay: .3s">Zw</text>
  <text class="in" x="100" y="174" font-size="15" text-anchor="middle" style="animation-delay: .35s">Zweisteinium</text>
  <text class="mono in" x="100" y="198" font-size="10" text-anchor="middle" letter-spacing="1.5" style="fill: var(--muted); animation-delay: .4s">SUPERACTINIDE</text>
</svg>
